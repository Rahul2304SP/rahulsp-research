# Cloudflare Pages config for rahulsp-research.
# Build command stays in the dashboard (Next static export); this file only declares
# the static output dir (unchanged) and the KV binding the /api/us30vol Function reads.
name = "rahulsp-research"
pages_build_output_dir = "out"
compatibility_date = "2024-11-01"

# KV namespace backing the US30 Volatility Dial relay (GET/POST /api/us30vol).
# Created via `wrangler kv namespace create us30vol`.
[[kv_namespaces]]
binding = "US30VOL"
id = "85bd59695b30431589b0dce215f3da0f"

# World Tension GPR relay (GET/POST /api/gpr) shares the SAME namespace under a distinct key
# ("gpr_latest"), so no new namespace is needed. /api/gpr falls back to US30VOL if this binding
# is absent, but declaring it keeps the two tools' code cleanly separated.
[[kv_namespaces]]
binding = "GPR"
id = "85bd59695b30431589b0dce215f3da0f"

# World Money-Flow live relay (GET/POST /api/moneyflow). R2 (not KV) because the local emitter
# overwrites the live slice every ~60s = ~43k writes/month = 4% of R2's 1M/mo free cap, whereas it
# would blow KV's 1,000/day cap. The MONEYFLOW_WRITE_KEY secret is NOT declared here (secrets are set
# via `wrangler pages secret put MONEYFLOW_WRITE_KEY` or the dashboard env vars — never committed).
[[r2_buckets]]
binding = "MONEYFLOW"
bucket_name = "moneyflow"

# UK Rate Watch relay (GET/POST /api/ukrates). Reuses the SAME namespace under its own
# key ("ukrates_latest") — the mortgage monitor posts ~4x/day, well under the KV write cap.
# Secret UKRATES_WRITE_KEY set via `wrangler pages secret put` (never committed).
[[kv_namespaces]]
binding = "UKRATES"
id = "85bd59695b30431589b0dce215f3da0f"

# Private property valuation report (GET/POST /api/homefinder). Reuses the SAME KV
# namespace under its own key ("homefinder_report") — the report updates infrequently
# (manual/weekly), well under KV's 1,000/day cap. Two secrets gate it and are NOT
# declared here (set via `wrangler pages secret put`, never committed):
#   HOMEFINDER_KEY        — the passkey users type (gates the GET)
#   HOMEFINDER_WRITE_KEY  — random; the local emitter sends it to publish (POST)
[[kv_namespaces]]
binding = "HOMEFINDER"
id = "85bd59695b30431589b0dce215f3da0f"
